<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JITSUGYO シフト希望提出アプリ">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EA5F98">

  <!-- iOS "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="シフト希望">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>シフト希望 | JITSUGYO</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FFFFFF;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }
    #loading-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-splash img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(234, 95, 152, 0.25);
    }
    #loading-splash .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid rgba(234, 95, 152, 0.18);
      border-top-color: #EA5F98;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
    }
    #loading-splash .loading-text {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #9AA0A6;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/Icon-192.png" alt="シフト希望">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中です…</div>
  </div>

  <script>
    // Only clear old service worker caches when the build actually changed,
    // instead of on every single visit. Forcing a full re-download on every
    // load was making repeat visits just as slow as the very first visit.
    (function () {
      var CURRENT_BUILD = '__BUILD_TS__';
      var STORAGE_KEY = 'jitsugyo_build_ts';
      try {
        var lastBuild = window.localStorage.getItem(STORAGE_KEY);
        if (lastBuild !== CURRENT_BUILD) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if (window.caches && window.caches.keys) {
            caches.keys().then(function (names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          window.localStorage.setItem(STORAGE_KEY, CURRENT_BUILD);
        }
      } catch (e) {
        // localStorage unavailable (e.g. privacy mode) - fall back to no-op.
      }
    })();

    // Hide the loading splash once Flutter has attached its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=__BUILD_TS__" async></script>
</body>
</html>
