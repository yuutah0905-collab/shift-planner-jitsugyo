<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JITSUGYO シフト希望提出アプリ">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EA5F98">

  <!-- iOS "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="シフト希望">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>シフト希望 | JITSUGYO</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* iOS Safari fix: Flutter's web engine only pins <body> to the screen
       (position: fixed + overflow: hidden), but on iOS Safari the actual
       scrolling/bounce container is <html>, not <body>. Without this same
       lock on <html>, a finger-drag anywhere on the page can trigger iOS's
       native rubber-band scroll on <html> while Flutter's own content stays
       visually pinned to <body> - so the page's real scroll position and
       Flutter's on-screen layout momentarily disagree, and iOS computes tap
       coordinates against the wrong one. The visible symptom reported by
       users: buttons/dropdowns only respond if you tap noticeably ABOVE
       where they're actually drawn. Locking <html> down the same way <body>
       already is prevents iOS from ever scrolling it, so this mismatch (and
       the tap-offset bug) can't happen.
       Related: https://github.com/flutter/flutter/issues/183596 */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      background: #FFFFFF;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }
    #loading-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-splash img {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(234, 95, 152, 0.25);
    }
    #loading-splash .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid rgba(234, 95, 152, 0.18);
      border-top-color: #EA5F98;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
    }
    #loading-splash .loading-text {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #9AA0A6;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/Icon-192.png" alt="シフト希望">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中です…</div>
  </div>

  <script>
    // Hide the loading splash once Flutter has attached its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 400);
      }
    });

    // Only clear old service worker caches when the build actually changed,
    // instead of on every single visit. Forcing a full re-download on every
    // load was making repeat visits just as slow as the very first visit.
    //
    // IMPORTANT: unregister()/caches.delete() are async and do NOT take
    // effect on the page that triggers them - a service worker that is
    // already controlling this page keeps controlling it (and keeps
    // intercepting fetches with its OLD cached files) until the page is
    // reloaded/navigated. That means simply firing these calls and then
    // immediately loading flutter_bootstrap.js via a static <script> tag
    // (as before) let the STILL-ACTIVE old service worker intercept that
    // very request and serve its stale cached main.dart.js/flutter_bootstrap.js
    // - so the user kept seeing the OLD broken build even after we deployed
    // a fix, and even though index.html itself was freshly fetched.
    //
    // Fix: flutter_bootstrap.js is no longer a static tag. We only inject it
    // (dynamically, via document.createElement) after we are sure no old
    // service worker cleanup is pending. If cleanup IS needed, we wait for it
    // to finish and then force exactly one reload, so the retry happens with
    // a clean slate before flutter_bootstrap.js is ever requested.
    (function () {
      var CURRENT_BUILD = '__BUILD_TS__';
      var STORAGE_KEY = 'jitsugyo_build_ts';
      var RELOAD_GUARD_KEY = 'jitsugyo_build_reload_guard';

      function loadBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + CURRENT_BUILD;
        s.async = true;
        document.body.appendChild(s);
      }

      try {
        var lastBuild = window.localStorage.getItem(STORAGE_KEY);
        if (lastBuild === CURRENT_BUILD) {
          loadBootstrap();
          return;
        }

        // Build changed (or first visit). Clean up any old service worker /
        // caches first, then reload once so the next load starts clean.
        var alreadyReloadedForThisBuild = window.sessionStorage.getItem(RELOAD_GUARD_KEY) === CURRENT_BUILD;
        window.localStorage.setItem(STORAGE_KEY, CURRENT_BUILD);

        if (alreadyReloadedForThisBuild) {
          // We already reloaded once for this build (or reload/storage isn't
          // working in this environment) - don't risk a reload loop, just
          // proceed to load the app directly.
          loadBootstrap();
          return;
        }

        var cleanupTasks = [];
        if ('serviceWorker' in navigator) {
          cleanupTasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (r) { return r.unregister(); }));
            }).catch(function () {})
          );
        }
        if (window.caches && window.caches.keys) {
          cleanupTasks.push(
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }).catch(function () {})
          );
        }

        if (cleanupTasks.length === 0) {
          // No service worker / cache API available - nothing to clean, just load.
          loadBootstrap();
          return;
        }

        window.sessionStorage.setItem(RELOAD_GUARD_KEY, CURRENT_BUILD);
        // Safety net: if cleanup somehow never settles, don't leave the user
        // stuck forever - fall back to loading the app after 3s. Guard
        // against both paths firing (fallback timeout AND cleanup finishing)
        // by only acting once.
        var settled = false;
        var fallback = setTimeout(function () {
          if (settled) return;
          settled = true;
          loadBootstrap();
        }, 3000);
        Promise.all(cleanupTasks).then(function () {
          if (settled) return;
          settled = true;
          clearTimeout(fallback);
          window.location.reload();
        });
      } catch (e) {
        // localStorage/sessionStorage unavailable (e.g. privacy mode) - fall
        // back to just loading the app directly.
        loadBootstrap();
      }
    })();
  </script>
</body>
</html>
