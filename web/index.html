  <link rel="manifest" href="manifest.json">
  <script>
    // Force-clear any previously installed Flutter Web service worker and
    // caches so users always get the latest build instead of a stale one.
    // Without this, browsers can keep serving an old cached version of
    // main.dart.js even after the server has a fresh build deployed.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if (window.caches && window.caches.keys) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
